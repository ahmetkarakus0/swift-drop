[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
addopts = -ra --strict-markers --import-mode=importlib
log_cli = false
log_level = INFO
markers =
    user_service: cases that only involve the user service
    restaurant_service: cases that involve the restaurant service
    cross_service: cases that span multiple services
    smoke: short happy-path cases for a quick health check
