[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
addopts = -ra --strict-markers --import-mode=importlib
log_cli = false
log_level = INFO
markers =
    story: complete user stories that follow one or more actors across services
    gateway: stories that send all their requests through the gateway
    smoke: short happy-path stories for a quick health check
